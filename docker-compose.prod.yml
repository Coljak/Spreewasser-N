volumes:
  database_data:
  static_data:
  media_data:
services:
  app:
   
    volumes:
      - ./app/model_imports:/app/model_imports
      - ./app_data:/app_data
      - static_data:/vol/web/static
      - media_data:/vol/web/media

    command: ["entrypoint.prod.sh"]


  # Postgres database
  db:
    volumes:
    - database_data:/var/lib/postgresql/data 
  geoserver:
  redis:
  thredds:
  nginx:
    build: 
      context: .
      dockerfile: Dockerfile.nginx

    ports:
      - 80:80
    volumes:
      - /etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl/klima-hub:/etc/ssl/klima-hub:ro
      - static_data:/vol/web/static
      - media_data:/vol/web/media
    depends_on:
      - app
    container_name: swn_nginx
    networks:
      - swn_network

